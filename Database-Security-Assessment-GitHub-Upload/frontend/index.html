<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBShield | Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <div class="brand">DB<span>Shield</span></div>
    <h1>Database Security Assessment</h1>
    <p class="muted">Ethical Hacking & Hardening Platform</p>

    <form id="loginForm">
        <label>Username</label>
        <input id="username" required placeholder="Enter username">

        <label>Password</label>
        <input id="password" type="password" required placeholder="Enter password">

        <button type="submit">Secure Login</button>
        <p id="loginMessage" class="message"></p>
    </form>

    <div class="demo-box">
        <strong>Demo accounts</strong>
        <small>Admin: admin / Admin@12345</small>
        <small>Tester: tester / Tester@12345</small>
        <small>Viewer: viewer / Viewer@12345</small>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
